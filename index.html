<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#19324D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=0111">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=0111">
<title>ABA – Anděl Bet Analytics</title>
<style>
:root{
  --nav:#19324D; --nav2:#274A6A; --bg:#F4F6F8; --card:#fff; --text:#263238;
  --muted:#607D8B; --gold:#B08D57; --pos:#2E7D32; --neg:#B23A3A; --line:#E0E5E9;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:#fff;width:min(420px,100%);padding:28px;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.login-card h1{margin:0;color:var(--nav);font-size:30px}
.login-card p{margin:4px 0 24px;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:white}
textarea{min-height:90px;resize:vertical}
.primary{background:var(--nav);color:#fff;border:0;border-radius:10px;padding:12px 16px}
.secondary{background:#fff;color:var(--nav);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.danger{background:var(--neg);color:#fff;border:0;border-radius:10px;padding:10px 14px}
#app{min-height:100vh}
header{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:3}
header strong{color:var(--nav)}
.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 58px)}
nav{background:var(--nav);padding:14px 10px}
nav button{display:block;width:100%;text-align:left;background:transparent;color:#fff;border:0;border-radius:9px;padding:13px 14px;margin:3px 0}
nav button.active,nav button:hover{background:var(--nav2)}
main{padding:24px;min-width:0}
h2{margin:0 0 18px;color:var(--nav)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.card .k{font-size:13px;color:var(--muted)}
.card .v{font-size:24px;font-weight:700;margin-top:8px}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{color:var(--muted);font-weight:600;background:#FAFBFC}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input{max-width:360px}
.ticket-head{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#fff;border:1px solid var(--line);padding:16px;border-radius:14px}
.match-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.grid3{display:grid;grid-template-columns:2fr 2fr 1fr;gap:10px}
.row-actions{display:flex;gap:10px;justify-content:space-between;margin-top:14px}
.small{font-size:12px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  nav{position:sticky;top:58px;display:flex;overflow:auto;z-index:2;padding:8px}
  nav button{white-space:nowrap;width:auto}
  .cards{grid-template-columns:repeat(2,1fr)}
  .ticket-head,.grid3{grid-template-columns:1fr}
  main{padding:16px}
}
.country-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.country-tile{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.country-tile.green{border-left:8px solid #2E7D32}
.country-tile.yellow{border-left:8px solid #D5A100}
.country-tile.red{border-left:8px solid #B23A3A}
.country-tile.gray{border-left:8px solid #90A4AE}
.analytics-section{margin-top:26px}
.filter-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px}
.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.analytics-table td,.analytics-table th{white-space:nowrap}
.status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.status-green{background:#2E7D32}.status-yellow{background:#D5A100}.status-red{background:#B23A3A}.status-gray{background:#90A4AE}
@media(max-width:900px){.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.filter-grid{grid-template-columns:1fr}}
.chart-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden}
.simple-bar{height:14px;background:#E8EDF1;border-radius:8px;overflow:hidden}
.simple-bar>span{display:block;height:100%;border-radius:8px}
.icon-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#F1F4F7;font-size:13px;margin-left:6px}
.check-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.check-row label{display:flex;align-items:center;gap:6px;margin:0;color:var(--text)}
.check-row input{width:auto}
@media(max-width:900px){.country-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.cards,.country-grid{grid-template-columns:1fr}}

#abaSplash{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:#080B0D;
  transition:opacity .35s ease,visibility .35s ease;
}
#abaSplash.hide{opacity:0;visibility:hidden;pointer-events:none}
#abaSplashInner{text-align:center;padding:24px}
#abaSplash img{
  width:min(52vw,320px);height:auto;border-radius:24%;
  display:block;margin:0 auto 18px;
}
#abaSplashTitle{font-size:28px;font-weight:700;letter-spacing:.08em;color:#fff}
#abaSplashSub{margin-top:8px;font-size:14px;letter-spacing:.12em;color:#1FD6E5}
#abaSplashVersion{margin-top:12px;font-size:12px;color:#8AA0AE}








.chart-box{
  position:relative;
  overflow:hidden;
}
.chart-watermark{
  position:absolute;
  left:50%;
  top:47%;
  width:min(70%,620px);
  height:auto;
  transform:translate(-50%,-50%);
  opacity:0.05;
  pointer-events:none;
  z-index:0;
}
.chart-box svg,
.chart-box .small{
  position:relative;
  z-index:1;
}


:root{
  --teal:#0799A3;
  --teal-dark:#087D86;
  --teal-soft:#EAF7F8;
}
header strong::first-letter{color:var(--teal)}
nav{padding-top:18px}
.nav-logo{
  display:flex;justify-content:center;align-items:center;
  padding:4px 12px 18px;
}

nav button{
  position:relative;padding-left:48px;
}

nav button.active{
  background:linear-gradient(135deg,#087985,#16A9B3);
  box-shadow:0 8px 20px rgba(0,0,0,.16);
}
.dashboard-top .card,
.dashboard-secondary .card{
  box-shadow:0 5px 18px rgba(25,50,77,.08);
}
.dashboard-top .card .v,
.dashboard-secondary .card .v{
  color:var(--teal);
}
.dashboard-top .card .v.pos,
.dashboard-secondary .card .v.pos{color:var(--pos)}
.dashboard-top .card .v.neg,
.dashboard-secondary .card .v.neg{color:var(--neg)}

.dashboard-chart{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px 18px 12px;
  box-shadow:0 5px 18px rgba(25,50,77,.08);
}
.dashboard-summary{
  margin-top:14px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:14px 10px;
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  gap:0;box-shadow:0 5px 18px rgba(25,50,77,.08);
}
.dashboard-summary .summary-item{
  padding:4px 14px;border-right:1px solid var(--line);
}
.dashboard-summary .summary-item:last-child{border-right:0}
.dashboard-summary .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.dashboard-summary .v{font-size:21px;font-weight:750;color:var(--teal)}
.dashboard-summary .v.pos{color:var(--pos)}
.dashboard-summary .v.neg{color:var(--neg)}
.chart-watermark{opacity:.05;width:min(70%,620px)}
.chart-box svg text{fill:var(--teal)}
@media(max-width:900px){
  .dashboard-summary{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dashboard-summary .summary-item:nth-child(3){border-right:0}
  .dashboard-summary .summary-item{border-bottom:1px solid var(--line)}
  .dashboard-summary .summary-item:nth-child(n+4){border-bottom:0}
}


.dashboard-metrics-4{
  display:grid !important;
  grid-template-columns:repeat(4,minmax(0,1fr)) !important;
  gap:14px !important;
  margin-top:14px;
}
.dashboard-metrics-4 .metric-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;min-height:96px;
  box-shadow:0 5px 18px rgba(25,50,77,.08);
}
.dashboard-metrics-4 .metric-card .k{
  font-size:13px;color:var(--muted);margin-bottom:8px;
}
.dashboard-metrics-4 .metric-card .v{
  font-size:24px;font-weight:750;color:var(--teal);
}
.dashboard-metrics-4 .metric-card .v.pos{color:var(--pos)}
.dashboard-metrics-4 .metric-card .v.neg{color:var(--neg)}

.dashboard-metrics-6{
  display:grid !important;
  grid-template-columns:repeat(6,minmax(0,1fr)) !important;
  margin-top:14px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:12px 6px;
  box-shadow:0 5px 18px rgba(25,50,77,.08);
}
.dashboard-metrics-6 .summary-item{
  padding:6px 14px;border-right:1px solid var(--line);
  min-width:0;
}
.dashboard-metrics-6 .summary-item:last-child{border-right:0}
.dashboard-metrics-6 .k{
  font-size:12px;color:var(--muted);margin-bottom:7px;
}
.dashboard-metrics-6 .v{
  font-size:21px;font-weight:750;color:var(--teal);
  white-space:nowrap;
}
.dashboard-metrics-6 .v.pos{color:var(--pos)}
.dashboard-metrics-6 .v.neg{color:var(--neg)}

@media(max-width:1100px){
  .dashboard-metrics-4{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .dashboard-metrics-6{grid-template-columns:repeat(3,minmax(0,1fr)) !important}
  .dashboard-metrics-6 .summary-item:nth-child(3n){border-right:0}
  .dashboard-metrics-6 .summary-item:nth-child(-n+3){border-bottom:1px solid var(--line)}
}
@media(max-width:650px){
  .dashboard-metrics-4{grid-template-columns:1fr !important}
  .dashboard-metrics-6{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .dashboard-metrics-6 .summary-item:nth-child(3n){border-right:1px solid var(--line)}
  .dashboard-metrics-6 .summary-item:nth-child(2n){border-right:0}
  .dashboard-metrics-6 .summary-item:nth-child(-n+4){border-bottom:1px solid var(--line)}
}



/* ABA 0.14.3 — branding podle schváleného návrhu */
nav{
  position:sticky;
  top:58px;
  height:calc(100vh - 58px);
  overflow-y:auto;
  padding:14px 12px 22px;
}
.nav-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:138px;
  padding:4px 8px 18px;
  overflow:visible;
}
.nav-logo img{
  display:block;
  width:174px;
  max-width:100%;
  height:auto;
  object-fit:contain;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.24));
}
nav button{
  display:flex;
  align-items:center;
  gap:14px;
  padding:13px 15px;
}
.nav-svg{
  width:23px;
  height:23px;
  flex:0 0 23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.dashboard-card-icon{
  float:right;
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--teal-soft);
  color:var(--teal);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:-38px;
}
.dashboard-card-icon svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.chart-watermark{
  position:absolute;
  left:50%;
  top:48%;
  width:min(62%,560px);
  height:auto;
  transform:translate(-50%,-50%);

  pointer-events:none;
  z-index:0;
  object-fit:contain;

}
.chart-box{
  background:#fff;
}
.chart-box svg,
.chart-box .small{

}
@media(max-width:900px){
  nav{
    position:sticky;
    top:58px;
    height:auto;
    overflow-x:auto;
    overflow-y:hidden;
    padding:8px;
  }
  .nav-logo{display:none}
  nav button{flex:0 0 auto}
}


/* ABA 0.15.0 — Dashboard Rebuild */
#view-dashboard{
  --dash-teal:#0799A3;
  --dash-teal-dark:#077D86;
  --dash-teal-soft:#EAF7F8;
  --dash-green:#198754;
  --dash-red:#C63F4A;
}
.dashboard-shell{
  display:flex;
  flex-direction:column;
  gap:15px;
}
.dashboard-title{
  margin:0 0 2px;
  font-size:25px;
  color:#18334D;
}
.dashboard-kpi-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}
.dashboard-kpi,
.dashboard-detail-card{
  position:relative;
  min-width:0;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 7px 22px rgba(25,50,77,.08);
}
.dashboard-kpi{
  min-height:96px;
  padding:17px 72px 17px 19px;
}
.dashboard-label{
  color:var(--muted);
  font-size:13px;
  margin-bottom:8px;
}
.dashboard-value{
  color:var(--dash-teal);
  font-size:27px;
  line-height:1.15;
  font-weight:780;
  white-space:nowrap;
}
.dashboard-value.pos{color:var(--dash-green)}
.dashboard-value.neg{color:var(--dash-red)}
.dashboard-icon{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  width:47px;
  height:47px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:var(--dash-teal-soft);
  color:var(--dash-teal);
}
.dashboard-icon svg,
.dashboard-detail-icon svg,
.dashboard-mini-icon svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.dashboard-chart{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:17px 19px 13px;
  box-shadow:0 7px 22px rgba(25,50,77,.08);
}
.dashboard-chart h3{
  margin:0 0 8px;
  color:#18334D;
  font-size:18px;
}
.dashboard-chart .chart-box{
  border:0;
  box-shadow:none;
  padding:0;
}
.dashboard-chart .chart-watermark{
  width:min(58%,520px);
  opacity:.075;
}
.dashboard-detail-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
}
.dashboard-detail-card{
  min-height:98px;
  padding:16px 58px 16px 18px;
}
.dashboard-detail-value{
  color:var(--dash-teal);
  font-size:23px;
  line-height:1.15;
  font-weight:770;
  white-space:nowrap;
}
.dashboard-detail-value.pos{color:var(--dash-green)}
.dashboard-detail-value.neg{color:var(--dash-red)}
.dashboard-detail-icon{
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--dash-teal);
}
.dashboard-summary-grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 7px 22px rgba(25,50,77,.08);
  overflow:hidden;
}
.dashboard-summary-item{
  position:relative;
  min-width:0;
  padding:15px 12px 14px 49px;
  border-right:1px solid var(--line);
}
.dashboard-summary-item:last-child{border-right:0}
.dashboard-summary-value{
  color:var(--dash-teal);
  font-size:21px;
  line-height:1.15;
  font-weight:770;
  white-space:nowrap;
}
.dashboard-summary-value.pos{color:var(--dash-green)}
.dashboard-summary-value.neg{color:var(--dash-red)}
.dashboard-mini-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--dash-teal);
}
.dashboard-mini-icon svg{
  width:23px;
  height:23px;
}
.chart-box svg text{fill:var(--dash-teal) !important}
@media(max-width:1100px){
  .dashboard-detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dashboard-summary-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dashboard-summary-item:nth-child(3n){border-right:0}
  .dashboard-summary-item:nth-child(-n+3){border-bottom:1px solid var(--line)}
}
@media(max-width:720px){
  .dashboard-kpi-grid{grid-template-columns:1fr}
  .dashboard-detail-grid{grid-template-columns:1fr}
  .dashboard-summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dashboard-summary-item:nth-child(3n){border-right:1px solid var(--line)}
  .dashboard-summary-item:nth-child(2n){border-right:0}
  .dashboard-summary-item:nth-child(-n+4){border-bottom:1px solid var(--line)}
  .dashboard-value{font-size:25px}
}


:root{--nav:#06131D;--nav2:#0A1D2A;--bg:#071018;--card:#0B1721;--card2:#0E1B26;--text:#F3F7FA;--muted:#9FB0BE;--line:#20313D;--pos:#16C784;--neg:#FF4D57;--teal:#00D6D6}
html,body{background:var(--bg);color:var(--text)}
body{background:linear-gradient(180deg,#061018,#08131C)}
header{background:#050D13;border-bottom:1px solid var(--line);color:var(--text);box-shadow:0 5px 18px rgba(0,0,0,.28)}
header strong,h1,h2,h3{color:var(--text)}
.layout,main{background:transparent}
nav{background:linear-gradient(180deg,#061521,#07131D);border-right:1px solid var(--line)}
nav button{color:#D6E1E8} nav button:hover{background:#0D2633}
nav button.active{background:linear-gradient(135deg,#087B84,#0DB4BC);color:#fff;box-shadow:0 8px 22px rgba(0,214,214,.16)}
.card,.analytics-section,.filter-panel,.table-wrap,.chart-box,.dashboard-kpi,.dashboard-chart,.dashboard-detail-card,.dashboard-summary-grid{background:linear-gradient(180deg,var(--card),var(--card2))!important;border-color:var(--line)!important;box-shadow:0 10px 28px rgba(0,0,0,.2)!important}
.card .k,.dashboard-label,.small,.muted{color:var(--muted)!important}
.card .v,.dashboard-value,.dashboard-detail-value,.dashboard-summary-value{color:var(--teal)}
.dashboard-value.pos,.dashboard-detail-value.pos,.dashboard-summary-value.pos,.pos{color:var(--pos)!important}
.dashboard-value.neg,.dashboard-detail-value.neg,.dashboard-summary-value.neg,.neg{color:var(--neg)!important}
.dashboard-icon{background:#0B2C34;color:var(--teal)}
.dashboard-detail-icon,.dashboard-mini-icon{color:var(--teal)}
input,textarea,select,button.secondary{background:#0A1620;color:var(--text);border-color:#2A3B48}
button.primary{background:linear-gradient(135deg,#07848D,#0EC6CE);color:#fff}
table{color:var(--text)} th{background:#0A1620;color:#B8C7D2} td{border-color:var(--line)} tr:hover td{background:#0C1B26}
.chart-box svg text{fill:#B9CAD4!important}.chart-box svg line{stroke:#20313D!important}.chart-box svg polyline{stroke:var(--teal)!important}.chart-box svg circle{fill:var(--teal)!important}
.chart-watermark{opacity:.065!important}
.dashboard-title-wrap{display:flex;align-items:center;justify-content:space-between;gap:14px}



/* ABA 0.16.1 — Final dark dashboard */
.dashboard-main-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 220px;
  gap:22px;
  align-items:stretch;
}
.dashboard-main-left{
  display:flex;
  flex-direction:column;
  gap:15px;
  min-width:0;
}
.dashboard-codex-link{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  gap:24px;
  min-height:100%;
  padding:26px 10px 26px 8px;
  color:var(--teal);

function migrateData(raw){
  const d=raw&&typeof raw==='object'?raw:structuredClone(defaultData);
  if(!d.settings)d.settings={startingBankroll:200000};
  if(d.settings.startingBankroll===undefined)d.settings.startingBankroll=200000;

    if(!Array.isArray(t.matches))t.matches=[];

    if(t.totalOdds===undefined)t.totalOdds=1;
    if(t.stake===undefined)t.stake=0;

    });

function loadData(){
  try{

  }catch(e){}
  return migrateData(structuredClone(defaultData));

function loadInternalBackups(){
  try{
    const value=JSON.parse(localStorage.getItem(BACKUP_KEY));
    return Array.isArray(value)?value:[];
  }catch(e){return []}
}
function createInternalBackup(snapshot){
  try{
    const backups=loadInternalBackups();
    const serialized=JSON.stringify(snapshot);
    const last=backups[0];
    if(last && last.data===serialized)return;
    backups.unshift({id:Date.now(),createdAt:new Date().toISOString(),data:serialized});
    localStorage.setItem(BACKUP_KEY,JSON.stringify(backups.slice(0,MAX_INTERNAL_BACKUPS)));
  }catch(e){}
}
function saveData(){
  data.schemaVersion=12;
  const previous=localStorage.getItem(KEY);
  if(previous){
    try{createInternalBackup(JSON.parse(previous))}catch(e){}
  }
  localStorage.setItem(KEY,JSON.stringify(data));
}
function money(n){return new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:0}).format(Number(n)||0)+' Kč'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function bytesToB64(bytes){
  let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s);
}
function b64ToBytes(s){
  return Uint8Array.from(atob(s), c=>c.charCodeAt(0));
}
async function derivePassword(password, saltBytes){
  const enc=new TextEncoder();
  const material=await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']
  );
  const bits=await crypto.subtle.deriveBits(
    {name:'PBKDF2', salt:saltBytes, iterations:120000, hash:'SHA-256'},
    material, 256
  );
  return bytesToB64(new Uint8Array(bits));
}
function authRecord(){
  try{return JSON.parse(localStorage.getItem(AUTH_KEY))}catch(e){return null}
}
function initAuthScreen(){
  const hasAuth=!!authRecord();
  document.getElementById('setupBox').classList.toggle('hidden',hasAuth);
  document.getElementById('loginBox').classList.toggle('hidden',!hasAuth);
  document.getElementById('loginUser').value='';

async function createAccount(){
  const username=document.getElementById('setupUser').value.trim();
  const pass=document.getElementById('setupPass').value;
  const pass2=document.getElementById('setupPass2').value;
  if(username.length<3)return alert('Login musí mít alespoň 3 znaky.');
  if(pass.length<6)return alert('Heslo musí mít alespoň 6 znaků.');
  if(pass!==pass2)return alert('Hesla se neshodují.');
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const hash=await derivePassword(pass,salt);
  localStorage.setItem(AUTH_KEY,JSON.stringify({username, salt:bytesToB64(salt), hash}));
  document.getElementById('setupPass').value='';
  document.getElementById('setupPass2').value='';
  alert('Přístup byl nastaven. Nyní se přihlas.');
  initAuthScreen();
}
async function login(){
  const rec=authRecord();
  if(!rec){initAuthScreen();return;}
  const username=document.getElementById('loginUser').value.trim();
  const password=document.getElementById('loginPass').value;
  const hash=await derivePassword(password,b64ToBytes(rec.salt));
  document.getElementById('loginPass').value='';
  if(username===rec.username && hash===rec.hash){
    sessionStorage.setItem('aba_unlocked','1');
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    renderAll();
  } else {
    alert('Nesprávný login nebo heslo.');
  }
}

}

function summary(){
  let profit=0,wins=0,losses=0,settledStake=0,open=0;
  data.tickets.forEach(t=>{
    if(['Otevřený','Rozpracovaný'].includes(t.status))open++;
    if(t.status==='Výherní'){profit+=(effectivePayout(t)-Number(t.stake||0));wins++;settledStake+=Number(t.stake||0)}
    if(t.status==='Proherní'){profit-=Number(t.stake||0);losses++;settledStake+=Number(t.stake||0)}
    if(t.status==='Vrácený'){profit+=(effectivePayout(t)-Number(t.stake||0));settledStake+=Number(t.stake||0)}
  });
  return {profit,current:data.settings.startingBankroll+profit,roi:settledStake?profit/settledStake*100:0,success:(wins+losses)?wins/(wins+losses)*100:0,open};
}

function todayProfit(){

 return data.tickets

}

function suggestedTicketStatus(t){
  const statuses=t.matches.map(m=>m.status);
  if(!statuses.length)return 'Rozpracovaný';
  if(statuses.some(s=>s==='Nevyšla'))return 'Proherní';
  if(statuses.every(s=>s==='Vyšla'||s==='Vrácena')){
    return statuses.every(s=>s==='Vrácena')?'Vrácený':'Výherní';
  }
  if(statuses.some(s=>s==='Vyšla'||s==='Vrácena'))return 'Otevřený';
  return 'Rozpracovaný';
}
function syncTicketFromMatches(id, showMessage=true){
  const t=data.tickets.find(x=>x.id===id);
  if(!t)return;
  const suggested=suggestedTicketStatus(t);
  t.status=suggested;
  if(suggested==='Výherní'){
    t.payout=Number(t.stake||0)*Number(t.totalOdds||1);
  }else if(suggested==='Vrácený'){
    t.payout=Number(t.stake||0);
  }else if(suggested==='Proherní'){
    t.payout=0;
  }
  saveData();
  if(showMessage)alert(`Tiket byl vyhodnocen jako: ${suggested}`);
}
function ticketStatusWarning(t){
  const suggested=suggestedTicketStatus(t);
  if(t.status===suggested)return '';
  return `<div class="viz-callout" style="margin:12px 0">
    Stav zápasů naznačuje: <strong>${suggested}</strong>, ale tiket je veden jako <strong>${esc(t.status)}</strong>.
  </div>`;
}

function editBetType(id,i,value){

}
function editCompetition(id,i,value){const t=data.tickets.find(x=>x.id===id);const parts=value.split('||');t.matches[i].country=parts[0]||'';t.matches[i].league=parts[1]||'';saveData()}
function editTicket(id,k,v){
 const t=data.tickets.find(x=>x.id===id);
 t[k]=['stake','totalOdds','payout'].includes(k)?(Number(String(v).replace(',','.'))||0):v;
 if(k==='status'){
   if(v==='Výherní' && Number(t.payout||0)<=0){
     t.payout=Number(t.stake||0)*Number(t.totalOdds||1);
   }
   if(v==='Vrácený' && Number(t.payout||0)<=0){
     t.payout=Number(t.stake||0);
   }
   if(v==='Proherní'){
     t.payout=0;
   }
 }
 saveData();
 renderDashboard();
}
function editMatch(id,i,k,v){
 const t=data.tickets.find(x=>x.id===id);
 t.matches[i][k]=k==='odds'?(Number(String(v).replace(',','.'))||1):v;
 saveData();
 if(k==='status'){
   const suggested=suggestedTicketStatus(t);
   if(['Výherní','Proherní','Vrácený'].includes(suggested)){
     syncTicketFromMatches(id,false);
   }
 }
}

function editConsidered(id,key,value){
 const x=data.consideredMatches.find(i=>i.id===id); if(!x)return;
 x[key]=value; saveData();
}
function removeConsidered(id){
 if(!confirm('Odstranit tento zvažovaný zápas?'))return;
 data.consideredMatches=data.consideredMatches.filter(i=>i.id!==id);
 saveData();drawConsidered();
}

function settledTickets(){
 return data.tickets.filter(t=>['Výherní','Proherní','Vrácený'].includes(t.status))
   .slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
}
function effectivePayout(t){
 const payout=Number(t.payout||0);
 if(t.status==='Výherní' && payout<=0){
   return Number(t.stake||0)*Number(t.totalOdds||1);
 }
 if(t.status==='Vrácený' && payout<=0){
   return Number(t.stake||0);
 }
 return payout;
}
function ticketProfit(t){
 if(t.status==='Výherní'||t.status==='Vrácený')return effectivePayout(t)-Number(t.stake||0);
 if(t.status==='Proherní')return -Number(t.stake||0);
 return 0;
}
function bankrollSeries(){
 let bank=Number(data.settings.startingBankroll||200000);
 const rows=[{label:'Start',value:bank}];
 settledTickets().forEach(t=>{bank+=ticketProfit(t);rows.push({label:t.date,value:bank,id:t.id})});
 return rows;
}
function bankrollChart(){
 const all=bankrollSeries();
 const now=new Date();
 const day=86400000;
 const limits={ '7D':7*day,'30D':30*day,'90D':90*day,'1R':365*day };
 let pts=all;
 if(dashboardChartRange!=='VŠE' && limits[dashboardChartRange]){
   const cutoff=now.getTime()-limits[dashboardChartRange];
   const filtered=all.filter(p=>new Date(p.date).getTime()>=cutoff);
   if(filtered.length>=2)pts=filtered;
 }
 const w=960,h=350,padL=62,padR=18,padT=24,padB=42;
 const values=pts.map(p=>Number(p.value||0));
 const min0=Math.min(...values),max0=Math.max(...values);
 const spread=Math.max(1,max0-min0);
 const min=Math.max(0,min0-spread*.12),max=max0+spread*.12;
 const x=i=>padL+(pts.length<=1?0:i*(w-padL-padR)/(pts.length-1));
 const y=v=>padT+(max-v)*(h-padT-padB)/(max-min||1);
 const line=pts.map((p,i)=>`${x(i)},${y(Number(p.value||0))}`).join(' ');
 const area=`${padL},${h-padB} ${line} ${x(pts.length-1)},${h-padB}`;
 const yTicks=5;
 const gridY=Array.from({length:yTicks},(_,i)=>{
   const val=max-i*(max-min)/(yTicks-1);
   const yy=y(val);
   return `<line class="bankroll-grid" x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}"/><text x="${padL-10}" y="${yy+4}" text-anchor="end">${money(val)}</text>`;
 }).join('');
 const maxLabels=7;
 const step=Math.max(1,Math.ceil(pts.length/maxLabels));
 const labels=pts.map((p,i)=>{
   if(i%step!==0 && i!==pts.length-1)return '';
   const d=new Date(p.date);
   return `<text x="${x(i)}" y="${h-12}" text-anchor="middle">${d.toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric'})}</text>`;
 }).join('');
 return `<div class="chart-box">
 <img class="chart-watermark" src="aba-watermark.png?v=0161" alt="">
 <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Vývoj bankrollu">
   <defs>
     <linearGradient id="bankrollAreaGradient" x1="0" y1="0" x2="0" y2="1">
       <stop offset="0%" stop-color="#00D6D6" stop-opacity=".46"/>
       <stop offset="100%" stop-color="#00D6D6" stop-opacity=".05"/>
     </linearGradient>
   </defs>
   ${gridY}
   <polygon class="bankroll-area" points="${area}"/>
   <polyline class="bankroll-line" points="${line}"/>
   ${pts.map((p,i)=>`<circle class="bankroll-point" cx="${x(i)}" cy="${y(Number(p.value||0))}" r="${pts.length<20?3:1.6}"/>`).join('')}
   ${labels}
 </svg>
 </div>`;
}
function countryStats(){
 const map={};
 data.tickets.forEach(t=>t.matches.forEach(m=>{
   if(!m.country||!['Vyšla','Nevyšla'].includes(m.status))return;
   if(!map[m.country])map[m.country]={country:m.country,league:m.league,wins:0,losses:0};
   if(m.status==='Vyšla')map[m.country].wins++; else map[m.country].losses++;
 }));
 return Object.values(map).map(x=>({...x,total:x.wins+x.losses,success:(x.wins/(x.wins+x.losses))*100}))
   .sort((a,b)=>b.success-a.success);
}

function analyticsDateRange(mode,fromValue,toValue){
 const today=new Date(); today.setHours(12,0,0,0);
 let from=null,to=null;
 if(mode==='30'){
   from=new Date(today);from.setDate(from.getDate()-29);to=today;
 }else if(mode==='90'){
   from=new Date(today);from.setDate(from.getDate()-89);to=today;
 }else if(mode==='year'){
   from=new Date(today.getFullYear(),0,1,12);to=today;
 }else if(mode==='custom'){
   from=fromValue?new Date(fromValue+'T12:00:00'):null;
   to=toValue?new Date(toValue+'T12:00:00'):null;
 }
 return {from,to};
}
function ticketInRange(t,range){
 const d=new Date(t.date+'T12:00:00');
 if(range.from&&d<range.from)return false;
 if(range.to&&d>range.to)return false;
 return true;
}
function filteredTickets(){
 const mode=document.getElementById('periodFilter')?.value||'all';
 const from=document.getElementById('periodFrom')?.value||'';
 const to=document.getElementById('periodTo')?.value||'';
 const range=analyticsDateRange(mode,from,to);
 return data.tickets.filter(t=>ticketInRange(t,range));
}

function aggregateByCountry(tickets){
 const map={};
 tickets.forEach(t=>t.matches.forEach(m=>{
   if(!m.country||m.country==='Evropské poháry'||!['Vyšla','Nevyšla','Vrácena'].includes(m.status))return;
   if(!map[m.country])map[m.country]={name:m.country,league:m.league||'',wins:0,losses:0,voids:0,total:0};
   const x=map[m.country]; x.total++;
   if(m.status==='Vyšla')x.wins++;
   if(m.status==='Nevyšla')x.losses++;
   if(m.status==='Vrácena')x.voids++;
 }));
 return Object.values(map).map(x=>({...x,success:(x.wins+x.losses)?x.wins/(x.wins+x.losses)*100:0}))
   .sort((a,b)=>b.success-a.success||b.total-a.total);
}
function aggregateByLeague(tickets){
 const map={};
 tickets.forEach(t=>t.matches.forEach(m=>{
   if(!m.league||!['Vyšla','Nevyšla','Vrácena'].includes(m.status))return;
   const key=(m.country||'')+'||'+m.league;
   if(!map[key])map[key]={country:m.country||'',name:m.league,wins:0,losses:0,voids:0,total:0};
   const x=map[key]; x.total++;
   if(m.status==='Vyšla')x.wins++;
   if(m.status==='Nevyšla')x.losses++;
   if(m.status==='Vrácena')x.voids++;
 }));
 return Object.values(map).map(x=>({...x,success:(x.wins+x.losses)?x.wins/(x.wins+x.losses)*100:0}))
   .sort((a,b)=>b.success-a.success||b.total-a.total);
}
function aggregateTicketFinancials(tickets){
 const map={};
 tickets.forEach(t=>{
   const uniqueCountries=[...new Set(t.matches.map(m=>m.country).filter(Boolean))];
   const uniqueLeagues=[...new Set(t.matches.map(m=>m.league).filter(Boolean))];
   const uniqueBetTypes=[...new Set(t.matches.map(m=>m.betType).filter(Boolean))];
   const profit=ticketProfit(t),stake=Number(t.stake||0);
   uniqueCountries.forEach(k=>{
     if(!map['C:'+k])map['C:'+k]={stake:0,profit:0,tickets:0};
     map['C:'+k].stake+=stake;map['C:'+k].profit+=profit;map['C:'+k].tickets++;
   });
   uniqueLeagues.forEach(k=>{
     if(!map['L:'+k])map['L:'+k]={stake:0,profit:0,tickets:0};
     map['L:'+k].stake+=stake;map['L:'+k].profit+=profit;map['L:'+k].tickets++;
   });
   uniqueBetTypes.forEach(k=>{
     if(!map['B:'+k])map['B:'+k]={stake:0,profit:0,tickets:0};
     map['B:'+k].stake+=stake;map['B:'+k].profit+=profit;map['B:'+k].tickets++;
   });
 });
 return map;
}
function analyticsColor(success,total){
 if(!total)return 'gray';
 if(success>=65)return 'green';
 if(success>=50)return 'yellow';
 return 'red';
}
function roiValue(fin){
 return fin&&fin.stake?fin.profit/fin.stake*100:0;
}

function aggregateByBetType(tickets){
 const map={};
 tickets.forEach(t=>t.matches.forEach(m=>{
   if(!m.betType||!['Vyšla','Nevyšla','Vrácena'].includes(m.status))return;
   const key=(m.betCategory||'Jiné')+'||'+m.betType;
   if(!map[key])map[key]={category:m.betCategory||'Jiné',name:m.betType,wins:0,losses:0,voids:0,total:0};
   const x=map[key];
   x.total++;
   if(m.status==='Vyšla')x.wins++;
   if(m.status==='Nevyšla')x.losses++;
   if(m.status==='Vrácena')x.voids++;
 }));
 return Object.values(map).map(x=>({...x,success:(x.wins+x.losses)?x.wins/(x.wins+x.losses)*100:0}))
   .sort((a,b)=>b.success-a.success||b.total-a.total);
}

function monthStatsForYear(year){
 const monthNames=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
 const rows=monthNames.map((name,index)=>({name,index,tickets:0,wins:0,losses:0,stake:0,profit:0}));
 data.tickets
   .filter(t=>Number(String(t.date||'').slice(0,4))===year && ['Výherní','Proherní','Vrácený'].includes(t.status))
   .forEach(t=>{
      const month=Number(String(t.date).slice(5,7))-1;
      if(month<0||month>11)return;
      const x=rows[month];
      x.tickets++;
      x.stake+=Number(t.stake||0);
      x.profit+=ticketProfit(t);
      if(t.status==='Výherní')x.wins++;
      if(t.status==='Proherní')x.losses++;
   });
 return rows.map(x=>({
   ...x,
   success:(x.wins+x.losses)?x.wins/(x.wins+x.losses)*100:0,
   roi:x.stake?x.profit/x.stake*100:0
 }));
}

       ${field('Rok',`<select id="monthYearFilter" onchange="renderMonthAnalytics()">${availableYears().map(y=>`<option value="${y}">${y}</option>`).join('')}</select>`)}
     </div>
   </div>
   <div id="monthAnalytics"></div>
 </div>
 <div class="analytics-section"><h2 style="font-size:18px">5. Analýza podle typu sázky</h2><div id="betTypeAnalytics"></div></div>
 <div class="analytics-section"><h2 style="font-size:18px">Vývoj bankrollu</h2>${bankrollChart()}</div>`;
 renderAnalyticsTables();
}
function renderSettings(){
 const el=document.getElementById('view-settings');el.innerHTML=`<h2>Nastavení</h2><div class="card">
 ${field('Počáteční bankroll',`<input id="bankroll" inputmode="decimal" value="${data.settings.startingBankroll}">`)}
 <div class="row-actions" style="flex-wrap:wrap">
<button class="primary" onclick="saveSettings()">Uložit</button>
<button class="secondary" onclick="exportData()">Exportovat kompletní zálohu</button>
<button class="secondary" onclick="document.getElementById('importBackup').click()">Obnovit ze souboru</button>
<button class="secondary" onclick="openInternalBackups()">Obnovit automatickou zálohu</button>
<input id="importBackup" type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])">
<button class="secondary" onclick="checkForUpdate()">Zkontrolovat aktualizaci</button>
<button class="secondary" onclick="resetLogin()">Změnit přihlášení</button>
<button class="danger" onclick="resetData()">Obnovit výchozí data</button>
</div>
 <p class="small">Verze: ABA 0.16.1 · Data jsou uložená pouze v tomto prohlížeči na tomto zařízení.</p></div>`;
}
function saveSettings(){data.settings.startingBankroll=Number(document.getElementById('bankroll').value.replace(',','.'))||200000;saveData();alert('Nastavení uloženo.');renderDashboard()}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ABA_zaloha_${new Date().toISOString().slice(0,10)}_v${APP_VERSION}.json`;a.click();URL.revokeObjectURL(a.href)}
function formatBackupDate(iso){
  try{return new Date(iso).toLocaleString('cs-CZ')}catch(e){return iso}
}
function openInternalBackups(){
  const backups=loadInternalBackups();
  if(!backups.length){
    alert('Zatím není k dispozici žádná automatická záloha.');
    return;
  }
  const choice=prompt('Zadej číslo zálohy, kterou chceš obnovit:\n\n'+backups.map((b,i)=>`${i+1}. ${formatBackupDate(b.createdAt)}`).join('\n'));
  if(!choice)return;
  const index=Number(choice)-1;
  if(!Number.isInteger(index)||index<0||index>=backups.length){
    alert('Neplatná volba.');
    return;
  }
  if(!confirm(`Obnovit zálohu z ${formatBackupDate(backups[index].createdAt)}? Současná data budou nejprve automaticky zazálohována.`))return;
  createInternalBackup(data);
  try{
    data=migrateData(JSON.parse(backups[index].data));
    saveData();
    renderAll();
    showView('dashboard');
    alert('Automatická záloha byla obnovena.');
  }catch(e){
    alert('Zálohu se nepodařilo obnovit.');
  }
}

function importData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const imported=migrateData(JSON.parse(reader.result));
      if(!confirm('Obnovit data ze zálohy? Současná data budou nahrazena obsahem zálohy.'))return;
      data=imported;
      saveData();
      alert('Záloha byla úspěšně obnovena.');
      renderAll();
      showView('dashboard');
    }catch(e){
      alert('Soubor zálohy není platný.');
    }
  };
  reader.readAsText(file);
}
async function checkForUpdate(){
  if(!('serviceWorker' in navigator)){alert('Aktualizace nejsou v tomto prohlížeči podporované.');return;}
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    if(!reg){alert('Aktualizační služba není aktivní. Otevři ABA jednou v Safari.');return;}
    await reg.update();
    if(reg.waiting){
      reg.waiting.postMessage({type:'SKIP_WAITING'});
      alert('Nová verze je připravena. ABA se nyní obnoví.');
      location.reload();
    }else{
      alert('Kontrola dokončena. Používáš nejnovější dostupnou verzi.');
    }
  }catch(e){
    alert('Aktualizaci se nepodařilo zkontrolovat. Zkus to později.');
  }
}
function resetLogin(){
  if(!confirm('Opravdu chceš zrušit současný login a nastavit nový?'))return;
  localStorage.removeItem(AUTH_KEY);
  logout();
}
function resetData(){if(confirm('Opravdu obnovit výchozí data?')){data=structuredClone(defaultData);saveData();renderAll();showView('dashboard')}}
function renderAll(){renderDashboard();renderHistory();renderWatchlist();renderStats();renderSettings()}
if ("serviceWorker" in navigator) {
  let refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(refreshing)return;
    refreshing=true;
    location.reload();
  });
  window.addEventListener("load", async()=>{
    const reg=await navigator.serviceWorker.register("./sw.js");
    reg.addEventListener("updatefound",()=>{
      const worker=reg.installing;
      if(!worker)return;
      worker.addEventListener("statechange",()=>{
        if(worker.state==="installed" && navigator.serviceWorker.controller){
          const useNow=confirm("Je dostupná nová verze ABA. Aktualizovat nyní? Tvoje data zůstanou zachovaná.");
          if(useNow)worker.postMessage({type:"SKIP_WAITING"});
        }
      });
    });
  });
}
</script>

<script>
window.addEventListener('load',()=>{
  const splash=document.getElementById('abaSplash');
  setTimeout(()=>splash?.classList.add('hide'),900);
});
</script>
